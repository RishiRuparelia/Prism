<!-- BACKGROUND SCENE -->
<div id="scene">
  <div id="sky"></div>
  <div id="stars"></div>
  <div id="moon"></div>

  <!-- Desert floor -->
  <div id="desert"></div>

  <!-- Sand dunes -->
  <div class="dune" style="width:340px;height:70px;left:-40px;bottom:17%;"></div>
  <div class="dune" style="width:260px;height:55px;right:-20px;bottom:17%;"></div>

  <div class="hieroglyph" style="top:10%;left:5%;animation-delay:0s;">𓂀 𓆣 𓅃 𓋹</div>

  <div id="prism-spectrum">
    <div class="spectrum-ray" style="background:linear-gradient(90deg,transparent,#ff0000);transform:rotate(-35deg);animation-delay:0s;"></div>
    <div class="spectrum-ray" style="background:linear-gradient(90deg,transparent,#ff7700);transform:rotate(-25deg);animation-delay:0.2s;"></div>
    <div class="spectrum-ray" style="background:linear-gradient(90deg,transparent,#ffff00);transform:rotate(-15deg);animation-delay:0.4s;"></div>

    <div class="spectrum-ray" style="background:linear-gradient(90deg,transparent,#cc00ff);transform:rotate(25deg);animation-delay:1.2s;"></div>

  <!-- PYRAMID SCENE -->
  <div id="pyramid-scene">
    <div id="pyramid-wrapper">
      <svg id="pyramid-svg" viewBox="0 0 440 300" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="blockFaceLight" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#c8a840" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#e8c870" stop-opacity="0.95"/>
          </linearGradient>
          <linearGradient id="blockFaceDark" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#7a6020" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#a08030" stop-opacity="0.95"/>
          </linearGradient>
          <linearGradient id="shadowGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#000" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#000" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="tipGlow" x1="0.5" y1="0" x2="0.5" y2="1">
            <stop offset="0%" stop-color="#fffbe0" stop-opacity="1"/>
            <stop offset="100%" stop-color="#c9a84c" stop-opacity="0.4"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- Row 9 (base) — widest -->
        <g class="block-row" style="animation-delay: 0.2s;">
          <rect x="44" y="256" width="39" height="22" fill="url(#blockFaceLight)" stroke="#9a7820" stroke-width="0.5"/>
          <rect x="83" y="256" width="39" height="22" fill="url(#blockFaceLight)" stroke="#9a7820" stroke-width="0.5"/>

          <rect x="200" y="256" width="39" height="22" fill="url(#blockFaceLight)" stroke="#9a7820" stroke-width="0.5"/>

          <rect x="278" y="256" width="39" height="22" fill="url(#blockFaceLight)" stroke="#9a7820" stroke-width="0.5"/>

          <rect x="44" y="256" width="14" height="22" fill="url(#shadowGrad)"/>
        </g>

        <!-- Row 8 -->
        <g class="block-row" style="animation-delay: 0.5s;">
          <rect x="60" y="234" width="38" height="22" fill="url(#blockFaceLight)" stroke="#9a7820" stroke-width="0.5"/>
          <rect x="98" y="234" width="38" height="22" fill="url(#blockFaceLight)" stroke="#9a7820" stroke-width="0.5"/>
          <rect x="136" y="234" width="38" height="22" fill="url(#blockFaceLight)" stroke="#9a7820" stroke-width="0.5"/>

          <rect x="228" y="124" width="20" height="22" fill="url(#blockFaceLight)" stroke="#9a7820" stroke-width="0.5"/>
        </g>

        <!-- Row 2 -->
        <g class="block-row" style="animation-delay: 2.3s;">
          <rect x="168" y="102" width="44" height="22" fill="url(#blockFaceLight)" stroke="#9a7820" stroke-width="0.5"/>

        <g class="block-row" style="animation-delay: 2.9s;">
          <polygon points="220,30 188,80 228,80" fill="url(#tipGlow)" filter="url(#glow)" opacity="0.9"/>

          <circle cx="218" cy="62" r="5" fill="none" stroke="#fffbe0" stroke-width="1" opacity="0.6"/>
          <circle cx="218" cy="62" r="2" fill="#fffbe0" opacity="0.8"/>
        </g>

        <!-- Pyramid shadow (right face) -->
        <polygon points="228,80 356,278 220,278" fill="rgba(0,0,0,0.35)" style="animation: none;"/>

        <!-- Base platform -->
        <rect x="40" y="276" width="320" height="6" fill="#5a4015" opacity="0.8"/>
        <rect x="40" y="282" width="320" height="3" fill="#3a2808" opacity="0.9"/>
      </svg>
    </div>

    <!-- Workers on pyramid -->
    <div id="workers"></div>

    <!-- Torches flanking pyramid -->
    <div class="torch" style="left:18px;bottom:0;">
