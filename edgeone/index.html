<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0805">
    <title>PRISM</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0805; }
      #prism-worker { position: fixed; inset: 0; display: block; width: 100%; height: 100%; border: 0; }
      .prism-direct { position: fixed; right: 12px; bottom: 10px; z-index: 2; padding: 6px 10px; color: #dfc77d; background: rgba(10, 8, 5, .9); border: 1px solid #64532b; border-radius: 5px; font: 11px/1.3 system-ui, sans-serif; text-decoration: none; opacity: .7; }
      .prism-direct:hover, .prism-direct:focus-visible { opacity: 1; outline: 1px solid #dfc77d; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <iframe id="prism-worker" src="https://prism.s2004826.workers.dev/" title="PRISM application" allow="autoplay; fullscreen; clipboard-write" allowfullscreen referrerpolicy="no-referrer"></iframe>
    <a class="prism-direct" href="https://prism.s2004826.workers.dev/" target="_blank" rel="noopener noreferrer">Open directly &#8599;</a>
  </body>
</html>
