    <div id="game"></div>
    <script>
      let bridge;
      const send = (method, value) => {
        if (bridge && window.unityGame) {
          window.unityGame.SendMessage(bridge, method, value);
        }
      };
      window.initPokiBridge = (object) => {
        bridge = object;
        send("ready");
      };
      window.commercialBreak = () => PokiSDK.commercialBreak().then(() => send("commercialBreakCompleted"));
      window.rewardedBreak = () => PokiSDK.rewardedBreak().then((watched) => send("rewardedBreakCompleted", String(watched)));
      window.shareableURL = () => send("shareableURLResolved", window.location.href);
      window.getUser = () => send("getUserResolved", "{}");
      window.getToken = () => send("getTokenResolved", "");
      window.login = () => send("loginRejected");

      (async () => {
        const data = Array.from({ length: 11 }, (_, i) => [
          `Build/FlyingCarTest.data.part${i + 1}`,
          i === 10 ? 8472723 : 10000000,
        ]);
        const wasm = Array.from({ length: 3 }, (_, i) => [
          `Build/FlyingCarTest.wasm.part${i + 1}`,
          i === 2 ? 8079051 : 10000000,
        ]);
        const framework = [["Build/FlyingCarTest.framework.js", 567653]];
        GameLoader.prepare([...data, ...wasm, ...framework]);
        const paths = (files) => files.map(([file]) => file);
        const [dataUrl, wasmCodeUrl, wasmFrameworkUrl] = await Promise.all([
          GameLoader.merge(paths(data)),
          GameLoader.merge(paths(wasm), "application/wasm"),
          GameLoader.merge(paths(framework), "application/javascript"),
        ]);
        const config = {
          companyName: "BlueAxis",
          productName: "FlyingCarSimulator",
          productVersion: "0.1",
          dataUrl, wasmCodeUrl, wasmFrameworkUrl,
          graphicsAPI: ["WebGL 2.0", "WebGL 1.0"],
          webglContextAttributes: { preserveDrawingBuffer: false },
          splashScreenStyle: "Dark",
          backgroundColor: "#231F20",
          cacheControl: { default: "must-revalidate" },
          developmentBuild: false,
          multithreading: false,
          unityVersion: "2019.3.0f3",
        };
        const configUrl = URL.createObjectURL(new Blob([JSON.stringify(config)], { type: "application/json" }));
        window.unityGame = UnityLoader.instantiate("game", configUrl, {
          Module: {
            // The legacy loader otherwise prefixes blob URLs with "Build/".
            locateFile(file) {
              return file === "build.wasm"
                ? wasmCodeUrl
                : new URL(`Build/${file}`, document.baseURI).href;
            },
            onRuntimeInitialized() {
              GameLoader.finish();
              document.querySelector("canvas")?.focus();
            },
          },
        });
      })().catch(GameLoader.fail);
    </script>
