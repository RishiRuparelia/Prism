<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #game {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>

<body>

  <div id="game"></div>

  <script>
    // Load the game's JavaScript
    const script = document.createElement("script");

    script.src =
      "https://cdn.jsdelivr.net/gh/TheEpicCreator/totallyNotRetroBowlQB@v1.0.0/html5game/uph_poki.js";

    script.onload = () => {
      console.log("Game script loaded");
    };

    script.onerror = () => {
      document.getElementById("game").innerHTML =
        "<h2 style='color:white'>Game failed to load.</h2>";
    };

    document.body.appendChild(script);

    // F11-like fullscreen button
    function fullscreen() {
      const game = document.getElementById("game");

      if (!document.fullscreenElement) {
        game.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }
  </script>

  <button
    onclick="fullscreen()"
    style="
      position:fixed;
      top:10px;
      right:10px;
      z-index:9999;
      padding:10px 15px;
      border:0;
      border-radius:6px;
      cursor:pointer;
    ">
    Fullscreen
  </button>

</body>
</html>
